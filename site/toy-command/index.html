<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOY COMMAND</title>
<style>
:root{color-scheme:dark;--paper:#fff2d4;--muted:#d1c7ba;--gold:#ffc66d;--ink:#11101b}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.6 system-ui,sans-serif;overflow-wrap:anywhere}body:lang(ko){word-break:keep-all}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(20px,calc((100vw - 1250px)/2));background:#171424}
header a,header button{color:inherit;background:none;border:0;font:inherit;padding:5px 7px;text-decoration:none;cursor:pointer}header a[aria-current]{color:var(--gold);text-decoration:underline;text-underline-offset:5px}
header strong{letter-spacing:.12em;font-size:13px}header nav{display:flex;flex-wrap:wrap;justify-content:flex-end}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:min(1250px,calc(100% - 44px));margin:auto}
.hero{background:radial-gradient(ellipse at 78% 34%,#3e2951,transparent 62%),#181322;border-bottom:1px solid #ffffff27}
.hero .wrap,.split{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:clamp(24px,5vw,76px);align-items:center}
.hero .wrap{padding-block:clamp(32px,7vw,96px)}
.logo{display:block;width:min(100%,470px);height:auto;margin:0 0 10px}
h1,h2,h3,p,figure{margin:0}h1,h2,h3{line-height:1.12;letter-spacing:-.04em}
h1{font-size:clamp(34px,5vw,66px)}h2{font-size:clamp(30px,4vw,56px)}h3{font-size:clamp(20px,2vw,26px)}
p{color:var(--muted);font-size:clamp(16px,1.5vw,20px);margin-top:12px;max-width:52ch}
section.wrap{padding-block:clamp(48px,7vw,100px);border-bottom:1px solid #ffffff26}
figure{min-width:0}video,.scene{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#21192f;border-radius:12px}
figcaption{font-size:16px;line-height:1.5;margin-top:9px;color:var(--muted)}
.action-stage{position:relative;isolation:isolate;margin-top:30px}.action-stage video{border:1px solid #ffcb7980}
.action-stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;box-shadow:inset 0 -45px 70px #0005}
.tactics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0;margin:24px 0 30px;list-style:none}
.tactics li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border-top:2px solid #bd8649;padding-top:13px}
.tactics svg{width:34px;height:34px;stroke:var(--gold);stroke-width:2;fill:none}
.tactics b{font-size:clamp(16px,2vw,22px);line-height:1.25}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3vw,36px);margin-top:28px}
.pair h3{margin-top:15px}.pair p{margin-top:7px}
.boss-zone{background:radial-gradient(ellipse at 85% 50%,#3b224b,transparent 64%)}
footer{padding:30px 0 46px}footer p{font-size:16px;max-width:none}
@media(max-width:730px){.hero .wrap,.split,.pair{grid-template-columns:1fr}.hero .wrap{gap:24px}.logo{max-width:370px}.tactics{gap:10px}.tactics li{grid-template-columns:1fr;gap:5px}.tactics svg{width:29px;height:29px}}
.map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:28px}.reference a{display:block}.reference .scene{object-fit:contain}.reference figcaption{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}.recapture{color:#ffcf8a;font-size:16px}.recapture::before{content:' · '}.jump{display:flex;flex-wrap:wrap;gap:8px 22px;padding-block:16px;border-bottom:1px solid #ffffff26}.jump a{color:var(--paper);text-underline-offset:4px}@media(max-width:730px){.map-grid{grid-template-columns:1fr}}
.arsenal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 20px;margin-top:32px}
.arsenal figcaption{font-size:clamp(20px,2.3vw,29px);font-weight:800;color:var(--paper)}
.arsenal p{margin-top:4px}
.boss-poster{margin-top:32px}
.boss-cast{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;isolation:isolate;padding:clamp(12px,4vw,52px) 3%;background:radial-gradient(ellipse at 52% 32%,#ab6332 0%,#432745 38%,#161120 72%);border-radius:18px;overflow:hidden}
.boss-cast img{width:100%;height:clamp(95px,17vw,230px);object-fit:contain;filter:drop-shadow(0 12px 10px #080611);transform:scale(1.12)}
.boss-cast img:nth-child(3n){transform:scale(1.24);z-index:1}
.arena-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:25px}
.mode-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:24px}
.mode-list article{display:flex;align-items:baseline;gap:15px;border-top:1px solid #ffc66d50;padding:15px 0}
.mode-list span{color:var(--gold);font-weight:800;font-size:23px}
.progression{max-width:none;margin-top:24px;color:var(--paper)}
@media(max-width:730px){.arsenal,.mode-list{grid-template-columns:1fr}.boss-cast{grid-template-columns:repeat(4,minmax(0,1fr))}}

.weapon-duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.32fr);gap:clamp(18px,3vw,36px);align-items:end;margin-top:30px}
.weapon-feature{min-width:0;padding:clamp(12px,2vw,25px);border-top:3px solid var(--weapon-color);background:linear-gradient(145deg,var(--weapon-bg),transparent 80%);border-radius:8px}
.weapon-shotgun{--weapon-color:#71ddff;--weapon-bg:#203c58}
.weapon-rocket{--weapon-color:#ffc26e;--weapon-bg:#5b302e}
.weapon-signal{display:flex;align-items:center;gap:12px;color:var(--weapon-color);margin-bottom:13px;font-size:clamp(16px,1.6vw,21px)}
.weapon-signal svg{width:51px;height:36px;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}
.weapon-feature figcaption{font-size:clamp(23px,3vw,38px);font-weight:800;color:var(--paper)}
.weapon-feature p{margin-top:3px}
.weapon-reel{margin-top:clamp(30px,5vw,58px)}
.weapon-reel .arsenal{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:15px;gap:12px}
.weapon-reel figcaption{font-size:clamp(16px,1.55vw,21px)}
@media(max-width:730px){.weapon-duel{grid-template-columns:1fr}.weapon-reel .arsenal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero{background:none;border:0;padding:18px 0 0}
.hero .wrap{position:relative;isolation:isolate;display:flex;align-items:center;min-height:clamp(360px,38vw,510px);padding:clamp(24px,5vw,68px);overflow:hidden;border-radius:18px;background:#181322}
.hero .wrap::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#151021f5 0%,#151021ca 33%,#15102137 70%,#15102112)}
.hero .wrap>div{max-width:590px}
.hero .wrap>figure{position:absolute;inset:0;z-index:-2}
.hero .wrap>figure video{height:100%;aspect-ratio:auto;object-position:center 59%;border-radius:0}
.hero .wrap>figure figcaption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.hero p{color:#fff0d6}
@media(max-width:730px){
 .hero .wrap{min-height:380px;align-items:end;padding:22px}
 .hero .wrap::after{background:linear-gradient(0deg,#151021f7,#151021ba 45%,#15102121 90%)}
 .hero .wrap>figure video{object-position:53% center}
}

.weapon-lineup,.mode-replays{margin-top:42px}
.weapon-lineup>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:15px;margin-top:18px}
.weapon-lineup figure{text-align:center;background:radial-gradient(ellipse at 50% 40%,#44314d,transparent 72%);padding:8px}
.weapon-lineup img{width:100%;height:105px;object-fit:contain}
.weapon-lineup figure:last-child img{object-position:center}
.mode-replays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.mode-replays article:last-child{grid-column:1/-1}
.mode-replays article>figure{margin-top:16px}
@media(max-width:730px){.mode-replays{grid-template-columns:1fr}}
.mode-replays .scene{aspect-ratio:auto;object-fit:contain;background:#251d30}.mode-replays figure+figure{margin-top:12px}.mode-replays .pair>div{min-width:0}
.development-note{display:block;color:#d4c5dc;font-size:16px;font-weight:400;line-height:1.45;margin-top:4px}
.hero .hero-note.wrap{display:block;min-height:0;padding:9px 0 0;overflow:visible;border-radius:0;background:none;color:#d4c5dc;font-size:16px}
.hero .hero-note.wrap::after{display:none}
.weapon-lineup>div{gap:10px}
.weapon-lineup figure{background:radial-gradient(ellipse at 50% 45%,#62405a65,transparent 76%),#201827;border:1px solid #ffc66d35;border-radius:12px;padding:12px 7px}
.weapon-lineup img{filter:drop-shadow(0 8px 8px #0008)}
.mode-list article{background:linear-gradient(100deg,#332137,transparent);padding:16px 14px;border-radius:6px}
.mode-list span{display:grid;place-items:center;min-width:42px;min-height:42px;border:1px solid #ffc66d64;border-radius:50%;font-size:19px}
.mode-replays article{border-top:2px solid #c49561;padding-top:14px}
.mode-replays .scene{max-height:245px}
</style></head>
<body><div id="app"></div>
<script>
const media = name => 'feature-media-1109/'+name;
const lang = new URLSearchParams(location.search).get('lang') || 'ko';
const locale = {ko:0,ja:1,en:2}[lang] ?? 0;
const t = (ko,ja,en) => [ko,ja,en][locale];
document.documentElement.lang=['ko','ja','en'][locale];
const developmentNote = t('개발 중인 화면입니다. 향후 업데이트될 예정입니다.','開発中の映像です。今後のアップデートで変更される予定です。','Work in progress. Footage will be updated as development continues.');
const clip = (key,caption,feature=false) => `<figure class="${feature?'action-stage':''}"><video muted loop playsinline preload="none" poster="${media(key+'.webp')}" aria-label="${caption}" data-src="${media(key+'.mp4')}"></video><figcaption>${caption}<span class="development-note">${developmentNote}</span></figcaption></figure>`;
const shot = (key,caption) => `<figure><img class="scene" src="${media(key+'.webp')}" alt="${caption}" loading="lazy"><figcaption>${caption}</figcaption></figure>`;
const heading = (title,body) => `<h2>${title}</h2><p>${body}</p>`;
const icons=['<path d="M17 3 28 8v10c0 7-6 11-11 13C12 29 6 25 6 18V8z"/>','<path d="M3 18h21m-7-8 8 8-8 8"/><path d="M5 10h6m-6 16h6"/>','<circle cx="17" cy="17" r="10"/><circle cx="17" cy="17" r="3"/><path d="M17 1v8m0 16v8M1 17h8m16 0h8"/>'];
const modes = [
 [t('토이 리그','トイリーグ','Toy League'),t('같은 장비로 실력을 겨루는 주간 점수전.','同じ装備で週間ハイスコアに挑戦。','Chase the weekly high score with a fixed loadout.'),'01'],
 ['TOY WEST',t('갈림길을 선택하며 원코인 클리어에 도전.','進む道を選び、ワンクレジットで完走。','Choose your route and clear it on one credit.'),'02'],
 [t('캡슐 러시','カプセルラッシュ','Capsule Rush'),t('강화 카드를 골라 매번 다른 조합으로 전투.','戦いの合間に強化カードを選び、組み合わせを試す。','Pick upgrades between fights to build a new loadout.'),'03'],
 [t('말랑성 원정','ぷにぷに城遠征','Squishy Castle Expedition'),t('장비와 모듈을 조합해 공장의 함정을 돌파하는 원정.','装備とモジュールを組み合わせ、工場のトラップを突破。','Mix gear and modules to survive the factory’s traps.'),'04']
];
const weapons = [
 ['shotgun',t('샷건','ショットガン','Shotgun'),t('가까이 몰려든 적에게 넓게 퍼지는 한 발.','近くに集まった敵を散弾で一掃。','A wide blast for enemies that crowd in close.')],
 ['rocket',t('로켓','ロケット','Rocket launcher'),t('적이 모인 곳에 폭발을 일으키는 한 발.','敵の集団に撃ち込み、爆発に巻き込む。','Fire into a group and catch it in the blast.')],
 ['disc',t('디스크','ディスク','Disc launcher'),t('원반이 날아가는 궤적을 보세요.','円盤が飛ぶ軌道に注目。','Watch the disc cut across the arena.')],
 ['dart',t('다트','ダーツ','Dart gun'),t('조준한 방향으로 다트를 쏩니다.','狙った方向へダーツを放つ。','Aim and send a dart downrange.')],
 ['slime',t('슬라임','スライム','Slime launcher'),t('슬라임 탄이 적에게 닿는 순간.','スライム弾が敵に当たる瞬間。','See what happens when a slime shot lands.')],
 ['confetti',t('색종이 폭죽','紙吹雪クラッカー','Confetti blaster'),t('색종이가 터지는 장난감 무기.','紙吹雪がはじけるおもちゃの武器。','A toy weapon that bursts into confetti.')]
];
const weaponArt = [["P", ["별 딱총", "スターポップガン", "Star Pop Gun"]], ["H", ["헤비 코르크 머신건", "ヘビーコルクマシンガン", "Heavy Cork Machine Gun"]], ["S", ["구슬 펌프 샷건", "ビー玉ポンプショットガン", "Marble Pump Shotgun"]], ["W", ["슈퍼 물대포", "スーパー水鉄砲", "Super Water Cannon"]], ["G", ["슬라임 유탄", "スライムグレネード", "Slime Grenade"]], ["R", ["폼로켓 런처", "フォームロケットランチャー", "Foam Rocket Launcher"]], ["D", ["디스크 런처", "ディスクランチャー", "Disc Launcher"]], ["F", ["컨페티 플레이머", "コンフェッティフレイマー", "Confetti Flamer"]], ["T", ["찌릿 정전기건", "静電チェーンガン", "Static Chain Gun"]], ["K", ["다트 저격 라이플", "ダーツスナイパーライフル", "Dart Sniper Rifle"]], ["L", ["스페이스 블래스터", "スペースブラスター", "Space Blaster"]], ["bomb", ["물풍선 폭탄", "水風船ボム", "Water Balloon Bomb"]], ["chicken", ["고무닭", "ゴム製チキン", "Rubber Chicken"]]];
document.querySelector('#app').innerHTML=`
<header><strong>TOY COMMAND</strong><nav>${['ko','ja','en'].map((key,i)=>`<a href="?lang=${key}${location.hash}" ${locale===i?'aria-current="true"':''}>${['한국어','日本語','English'][i]}</a>`).join('')}<button id="motion" type="button"></button></nav></header>
<main>
<section class="hero" id="home"><div class="wrap"><div><img class="logo" src="${media(locale===0?'toy-command-ko.png':'toy-command-intl.png')}" alt="${t('장난감 특공대','TOY COMMAND','TOY COMMAND')}"><h1>${t('크리스마스이브의 장난감 대소동','クリスマスイブのおもちゃ大騒動','Toy trouble on Christmas Eve')}</h1><p>${t('외계 생명체가 장난감 군단을 깨웠다! 태엽 토끼 잭 래빗이 가게를 지키러 출동한다.','クリスマスイブ。宇宙から来た何者かに取りつかれたおもちゃたちが店を襲う。ぜんまいウサギのジャック・ラビットが立ち向かう。','It’s Christmas Eve, and possessed toys are storming the shop. Wind-up rabbit Jack Rabbit is ready to fight back.')}</p></div>${clip('hero',t('물폭탄으로 병정 무리 공격','水風船でおもちゃ兵の集団を攻撃','A water balloon hits a squad of toy soldiers'))}</div><p class="hero-note wrap">${developmentNote}</p></section>
<nav class="jump wrap" aria-label="${t('섹션 이동','セクションへ移動','Jump to section')}">${[['combat',t('전투','戦闘','Combat')],['weapons',t('무기','武器','Weapons')],['bosses',t('보스','ボス','Bosses')],['campaign',t('전장','戦場','Arenas')],['modes',t('모드','モード','Modes')]].map(([id,label])=>`<a href="#${id}">${label}</a>`).join('')}</nav>
<section class="wrap" id="combat">${heading(t('엄폐와 구르기로 만드는 반격의 순간','隠れてかわして、反撃へ','Dodge, take cover, strike back'),t('상자 뒤에서 적의 사격을 피하고, 구르기로 사선을 벗어나세요. 빈틈이 보이면 한 발로 흐름을 뒤집을 차례!','敵が撃ってきたら箱の陰へ。弾が飛んでくる場所からはローリングで抜け出し、隙を見て撃ち返そう。','Duck behind a crate when enemies open fire. Roll out of the line of fire, then aim and shoot when you see an opening.'))}
${clip('roll',t('병정의 공격을 옆으로 굴러 피하는 잭','兵士の攻撃を横に転がってかわすジャック','Jack rolls sideways to dodge incoming fire'),true)}
<ol class="tactics">${[t('상자 뒤에 숨기','箱の陰に隠れる','Take cover'),t('탄이 오는 쪽에서 벗어나기','弾の軌道から外れる','Roll clear'),t('틈이 보이면 반격','隙を見て反撃','Fire back')].map((label,i)=>`<li><svg viewBox="0 0 34 34" aria-hidden="true">${icons[i]}</svg><b>${label}</b></li>`).join('')}</ol>
<div class="pair">${clip('cover',t('상자를 사이에 두고 병정과 대치','箱を挟んでおもちゃ兵と対峙','A crate between Jack and the soldiers'))}${shot('hero',t('물폭탄이 병정 무리에 명중','水風船がおもちゃ兵の集団に命中','A water balloon lands among the soldiers'))}</div>
</section>
<section class="wrap" id="weapons">${heading(t('장난감 무기로 펼치는 화끈한 사격전','おもちゃの武器で痛快シューティング','A toy arsenal with a punch'),t('구출한 장난감이 남긴 무기로 적을 공략하세요. 가까운 적은 샷건으로, 한곳에 모인 적은 로켓으로! 탄이 떨어져도 별 딱총으로 전투를 이어갑니다.','助けたおもちゃが落とした武器を拾おう。弾が尽きたらスターポップガンに戻ります。','Pick up weapons dropped by rescued toys. When the ammo runs out, Jack switches back to his Star Pop Gun.'))}
<div class="weapon-duel">${weapons.slice(0,2).map(([key,name,description],i)=>`<article class="weapon-feature weapon-${key}"><div class="weapon-signal"><svg viewBox="0 0 64 42" aria-hidden="true">${i===0?'<path d="M5 21 57 4M5 21h52M5 21l52 17"/><circle cx="57" cy="4" r="2"/><circle cx="57" cy="21" r="2"/><circle cx="57" cy="38" r="2"/>':'<path d="M4 21h36m8-17v9m0 16v9m-12-5 5-5m14-14 5-5m-5 19 5 5m-24-24 5 5"/><circle cx="48" cy="21" r="8"/>'}</svg><strong>${i===0?t('눈앞에 몰려올 때','目の前に押し寄せたら','When they rush you'):t('한곳에 뭉쳤을 때','一か所に集まったら','When they bunch up')}</strong></div>${clip(key,name)}<p>${description}</p></article>`).join('')}</div>

const videos=[...document.querySelectorAll('video')];
const toggle=document.querySelector('#motion');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sync = video => {
 if(paused || video.dataset.visible!=='true'){video.pause();return}
 if(!video.src) video.src=video.dataset.src;
 video.play().catch(()=>{video.controls=true});
};
const observer=new IntersectionObserver(entries=>entries.forEach(({target,isIntersecting})=>{target.dataset.visible=String(isIntersecting);sync(target)}),{threshold:.2});
videos.forEach(video=>observer.observe(video));
const label=()=>{toggle.textContent=paused?t('영상 재생','動画を再生','Play motion'):t('영상 정지','動画を停止','Pause motion');toggle.setAttribute('aria-pressed',String(paused));};
toggle.addEventListener('click',()=>{paused=!paused;label();videos.forEach(sync)});
label();
</script></body></html>
